name: Browser Runtime Proof

on:
  pull_request:
    paths:
      - "browser-proof.html"
      - "src/browser-proof/**"
      - "src/nucleo/lineage/BrowserRuntimeProof.ts"
      - "src/nucleo/lineage/VisualRuntimeEvidence.ts"
      - "tests/browser/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/browser-runtime-proof.yml"
  workflow_dispatch:

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload browser runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goodle-browser-runtime-evidence
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
