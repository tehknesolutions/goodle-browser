name: Goodle CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
  workflow_dispatch:

jobs:
  conformidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Browser runtime proof
        run: npx playwright install --with-deps chromium && npm run test:browser
