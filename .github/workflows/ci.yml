name: CI Goodle Diagnostic

on:
  push:
    branches:
      - fix/ci-runner-diagnostic
  pull_request:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner iniciou
        run: |
          echo "GOODLE_CI_RUNNER_OK"
          uname -a
          node --version || true
          npm --version || true
