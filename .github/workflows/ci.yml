name: CI Goodle

on:
  push:
    branches:
      - main
      - feat/oldrewrite-logica
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Testes
        run: npm test

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
