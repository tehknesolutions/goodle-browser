name: Goodle Runner Smoke

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Runner alive
        run: |
          echo "GOODLE_RUNNER_OK=1"
          node --version
          npm --version
