name: Runtime Check
on:
  push:
    branches: ["feat/hom-hnkir-verse-v0.1"]
  pull_request:
    branches: ["feat/hom-hnkir-verse-v0.1"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test -- --run
      - run: npm run build
